[project]
name = "corsa"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "pydantic>=2.0",
  "pydantic-settings",
  "httpx",
  "defusedxml",
  "fitdecode",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.mypy]
strict = true
