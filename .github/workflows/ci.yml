name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" pytest-cov
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: pip install -e .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: corsa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrations + /healthz)
        run: |
          docker run -d --name corsa -p 8000:8000 \
            -e STRAVA_CLIENT_ID=ci -e STRAVA_CLIENT_SECRET=ci \
            -e ALLOWED_LOGINS=ci -e AUTH_DEV_LOGIN=ci -e ENV=dev \
            -e DATABASE_URL=sqlite:////data/corsa.db \
            corsa:ci sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 2
          done
          docker logs corsa
          exit 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit && pip-audit .
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm audit --audit-level=high
